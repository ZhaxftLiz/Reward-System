name: Build Plugin Otomatis

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        unzip -o "*.zip" -d extracted_source || true
        
        # Mencari lokasi file pom.xml atau build.gradle secara mendalam
        CONFIG_PATH=$(find extracted_source -name "pom.xml" -o -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        
        if [ -z "$CONFIG_PATH" ]; then
          echo "Error: File pom.xml atau build.gradle benar-benar tidak ada di dalam ZIP!" && exit 1
        fi
        
        # Pindahkan isi dari folder proyek tersebut ke root direktori kerja
        PROJ_DIR=$(dirname "$CONFIG_PATH")
        mv "$PROJ_DIR"/* . || true
        # Pindahkan juga file tersembunyi jika ada (seperti .gradle atau gradlew)
        mv "$PROJ_DIR"/.* . || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

      
    - name: Build Project
      run: |
        if [ -f "pom.xml" ]; then
          # 1. Bersihkan error systemPath yang sebelumnya
          sed -i '/<systemPath>/d' pom.xml || true
          sed -i 's/<scope>system<\/scope>/<scope>provided<\/scope>/g' pom.xml || true
          
          # 2. Tambahkan Repositori resmi & cadangan PNX secara otomatis ke pom.xml agar tidak gagal download
          sed -i '/<repositories>/a \
            <repository>\n              <id>pnx-repo-cloud<\/id>\n              <url>https:\/\/repo.powernukkitx.cn\/repository\/maven-public\/<\/url>\n            <\/repository>\n            <repository>\n              <id>jitpack.io<\/id>\n              <url>https:\/\/jitpack.io<\/url>\n            <\/repository>' pom.xml || true
          
          # 3. Jalankan compile
          mvn clean package -DskipTests
        elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
          chmod +x gradlew || true
          ./gradlew build -x test || gradle build -x test
        else
          echo "Gagal mendeteksi file konfigurasi setelah pemindahan!" && exit 1
        fi
        

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: plugin-jar-file
        path: |
          target/*.jar
          build/libs/*.jar
          
